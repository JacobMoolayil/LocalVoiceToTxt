name: Build & Release LocalVoice

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WPF App
      run: dotnet publish src\LocalVoice.App\LocalVoice.App.csproj -c Release -o publish\LocalVoice

    - name: Package Release Archive
      run: powershell -ExecutionPolicy Bypass -File .\package_release.ps1

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        tag_name: ${{ github.ref_name != 'master' && github.ref_name || 'v1.0.0' }}
        name: LocalVoice ${{ github.ref_name != 'master' && github.ref_name || 'v1.0.0' }} - Offline GPU Voice to Text
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
